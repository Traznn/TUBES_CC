server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/books {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://book-service:5001;
    }
    location /api/members {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://member-service:5002;
    }
    location /api/loans {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://loan-service:5003;
    }
}
